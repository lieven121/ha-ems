name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Topics, brands and a description are repository settings, not
          # code; don't fail the build on them.
          ignore: brands topics description

  python:
    name: Lint and test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check custom_components tests
      - run: uv run --no-project --python 3.13 --with pytest python -m pytest

  card:
    name: Type-check and build (card)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Committed bundle is up to date
        run: git diff --exit-code -- custom_components/ha_ems/www/ha-ems.js
